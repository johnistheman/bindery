# Fork-only image build. Publishes to this fork's GHCR namespace
# (ghcr.io/<owner>/bindery) so the change can be pulled and run via Docker
# Compose. Intentionally separate from ci.yml: it triggers on this deploy
# branch and pushes ONLY to GHCR (no Docker Hub), so it works with the
# fork's GITHUB_TOKEN and no extra secrets.
name: fork-image

on:
  workflow_dispatch:
  push:
    branches: [deploy]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/bindery:subpath
            ghcr.io/${{ github.repository_owner }}/bindery:sha-${{ github.sha }}
          build-args: |
            VERSION=subpath-${{ github.sha }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
